name: Keep Streamlit apps awake

on:
  schedule:
    # Every 6 hours (UTC). Apps sleep after 12 hours of no traffic,
    # so this leaves plenty of margin even if one run fails.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping apps
        run: python keep_alive.py
